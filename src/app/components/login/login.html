<div class="paginaLogin">

    <div class="contenedorLogin">

        <h2>INICIAR SESIÓN</h2>

        <form [formGroup]="formularioLogin" (ngSubmit)="ingresar()">

            <label>Correo electrónico:</label>

            <input
                formControlName="email"
                type="email"
                placeholder="Ingrese su correo electrónico"
            >

            <label>Contraseña:</label>

            <div class="contenedorPassword">
                <input
                    formControlName="password"
                    [type]="mostrarPassword() ? 'text' : 'password'"
                    placeholder="Ingrese su contraseña"
                >

                <button
                    type="button"
                    class="botonOjo"
                    (click)="alternarPassword()"
                    [attr.aria-label]="mostrarPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
                >
                    @if (mostrarPassword()) {
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.6 20.6 0 0 1 5.06-6.06M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a20.6 20.6 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    } @else {
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    }
                </button>
            </div>

            @if(errorLogin()){
                <p class="error">Correo o contraseña incorrectos</p>
            }

            <button type="submit">
                Iniciar Sesión
            </button>

        </form>

    </div>

</div>
